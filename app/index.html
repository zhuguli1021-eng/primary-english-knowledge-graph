<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小学英语知识图谱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="data.js"></script>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--muted:#6b6f76;--line:#e3e1da;--accent:#2f6fde;--good:#2e9d5b;--mid:#d99a1e;--bad:#d2493e;--chip:#efede7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#202226;--ink:#e8e6e1;--muted:#9a9ea6;--line:#33363c;--accent:#6f9dff;--chip:#2a2d33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--card:#202226;--ink:#e8e6e1;--muted:#9a9ea6;--line:#33363c;--accent:#6f9dff;--chip:#2a2d33;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header h1{font-size:17px;margin:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.who{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
.scroll{overflow-x:auto}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--chip);font-size:12px;margin:2px 4px 2px 0;cursor:pointer;border:1px solid transparent}
.chip.off{opacity:.35}
.tier3{background:#fde3df;color:#9b2c22}.tier2{background:#fdf0d5;color:#8a5a00}.tier1{background:var(--chip);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tier3{background:#4a2422;color:#ffb4aa}:root:not([data-theme="light"]) .tier2{background:#3f3418;color:#ffd27a}}
#graphWrap{display:grid;grid-template-columns:1fr 380px;gap:14px}
#cy{height:72vh;min-height:480px;background:var(--card);border:1px solid var(--line);border-radius:12px}
#panel{height:72vh;min-height:480px;overflow:auto}
@media (max-width:900px){#graphWrap{grid-template-columns:1fr}#cy{height:60vh}#panel{height:auto}}
#panel h2{font-size:18px;margin:0 0 6px}
#panel h3{font-size:14px;margin:14px 0 4px;color:var(--muted)}
#panel ul{margin:0;padding-left:18px}
.link{color:var(--accent);cursor:pointer}
.q{border-top:1px dashed var(--line);padding:12px 0}
.q:first-child{border-top:0}
.qhead{display:flex;gap:8px;align-items:baseline}
.qnum{font-weight:600;min-width:2em}
.meta{font-size:12px;color:var(--muted)}
.opts label{display:block;padding:3px 6px;border-radius:6px;cursor:pointer}
.opts label:hover{background:var(--chip)}
.essay{width:100%;min-height:180px;font:15px/1.7 inherit;font-family:inherit}
.lines div{border-bottom:1px solid var(--line);height:30px}
.sec{font-weight:600;margin:18px 0 4px;padding-top:10px;border-top:2px solid var(--line)}
.ptag{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.passage{white-space:pre-wrap;background:var(--chip);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}
.res-ok{color:var(--good)}.res-bad{color:var(--bad)}
.explain{font-size:13px;color:var(--muted);margin-top:4px}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.mark button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 10px;cursor:pointer;color:var(--ink)}
.mark button.sel.ok{background:var(--good);color:#fff}.mark button.sel.bad{background:var(--bad);color:#fff}
textarea{width:100%;min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid}
@media print{header,nav,.noprint{display:none!important}main{padding:0}.card{border:0;padding:0}body{background:#fff;color:#000}}
</style>
</head>
<body>
<header>
  <h1>小学英语知识图谱</h1>
  <nav id="nav">
    <button data-tab="graph" class="on">知识图谱</button>
    <button data-tab="paper">出题组卷</button>
    <button data-tab="report">诊断与训练</button>
    <button data-tab="ai">AI 出题</button>
  </nav>
  <div class="who">学生 <input id="student" size="8" placeholder="姓名"></div>
</header>
<main>

<section id="tab-graph" class="tab on">
  <div class="card row small noprint">
    <span class="muted">领域</span><span id="domainChips"></span>
    <label><input type="checkbox" id="onlyCore"> 只看必考</label>
    <label><input type="checkbox" id="showRelated" checked> 显示真题共考关联</label>
    <label><input type="checkbox" id="showMastery"> 按当前学生掌握情况着色</label>
    <input id="search" placeholder="搜索知识点" size="10">
  </div>
  <div class="legend small noprint" style="margin:-6px 0 8px 4px">
    <span><i style="border-color:#8a8f98"></i>必须先学（hard）</span>
    <span><i style="border-color:#b8bcc4;border-top-style:dashed"></i>建议先学（soft）</span>
    <span><i style="border-color:#e08a2c;border-top-style:dotted"></i>真题常一起考</span>
    <span>圆圈越大 = 真题考频越高；横向是首学年级（7 = 小升初衔接）</span>
  </div>
  <div id="graphWrap">
    <div id="cy"></div>
    <div id="panel" class="card"><p class="muted">点一个知识点，查看说明、易错点、先修关系和真题例句。</p><div id="stats"></div></div>
  </div>
</section>

<section id="tab-paper" class="tab">
  <div class="card noprint">
    <div class="row">
      <label>年级 <select id="pGrade"></select></label>
      <label><span id="pCountLabel">基础题数</span> <input id="pCount" type="number" value="20" min="5" max="60" style="width:64px"></label>
      <label>组卷方式 <select id="pMode"><option value="exam">按真卷结构（单选、完形、阅读、填空、书面表达）</option><option value="mix">按知识点随机</option></select></label>
      <label>范围 <select id="pScope"><option value="all">全部知识点（按考频加权）</option><option value="domain">指定领域</option><option value="topics">指定知识点</option></select></label>
      <span id="pScopeExtra"></span>
      <button class="btn primary" id="pMake">生成试卷</button>
    </div>
    <p class="small muted" id="pRule"></p>
  </div>
  <div id="paperBox"></div>
</section>

<section id="tab-report" class="tab">
  <div id="reportBox"><div class="card muted">先在「出题组卷」生成一套题，让孩子在线作答或由老师录入对错，这里会给出诊断、点评和针对性练习。</div></div>
  <div id="practiceBox"></div>
</section>

<section id="tab-ai" class="tab">
  <div class="card">
    <h3 style="margin-top:0">1. 选题型、年级和难度</h3>
    <div class="row">
      <select id="aKind"><option value="single">单项题（选择 / 填空）</option><option value="passage">阅读理解篇章</option><option value="writing">书面表达</option></select>
      <select id="aTheme" hidden><option>应用文</option><option>科普跨学科</option><option>中国文化</option><option>记叙情感</option></select>
      <select id="aTopic"></select>
      <select id="aGrade"></select>
      <select id="aDiff"><option value="1">难度1 基础</option><option value="2" selected>难度2 标准</option><option value="3">难度3 提高</option></select>
      <label>题数 <input id="aN" type="number" value="5" min="1" max="20" style="width:56px"></label>
    </div>
    <p class="small muted" id="aHint"></p>
    <textarea id="aMat" hidden style="min-height:90px" placeholder="（可选）粘贴新闻报道（如 China Daily）的原文或要点、原文链接。AI 只取其中的事实，改写成适合孩子读的原创短文，不照抄原句。"></textarea>
  </div>
  <div class="card">
    <h3 style="margin-top:0">2. 直接调用大模型出题</h3>
    <div class="row">
      <label>模型 <select id="mProv">
        <option value="claude">Claude（在线版内置，用你自己的 Claude 账号，不需要密钥）</option>
        <option value="server">本机 llm.json 里配置的模型</option>
        <option value="openai">OpenAI 兼容接口（DeepSeek、通义千问、Kimi、智谱、豆包、OpenAI）</option>
        <option value="anthropic">Anthropic Claude API</option>
      </select></label>
      <select id="mPreset"></select>
    </div>
    <div class="row" id="mFields" style="margin-top:8px">
      <input id="mBase" placeholder="接口地址，如 https://api.deepseek.com/v1" style="flex:2;min-width:220px">
      <input id="mModel" placeholder="模型名" style="flex:1;min-width:120px">
      <input id="mKey" type="password" placeholder="API Key" autocomplete="off" style="flex:1;min-width:140px">
    </div>
    <label class="small" style="display:block;margin-top:8px"><input type="checkbox" id="mVerify" checked> 盲解复核：出完后让模型不看答案再做一遍，答案对不上或认为有歧义的题不入库</label>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="mGo">直接出题</button><button class="btn" id="mStop" hidden>停止</button><span class="small muted" id="mStatus"></span></div>
    <p class="small muted" id="mNote"></p>
  </div>
  <div class="card">
    <h3 style="margin-top:0">3. 或者：复制提示词给任意 AI，再把返回的 JSON 粘贴回来</h3>
    <div class="row"><button class="btn" id="aMake">生成提示词</button><button class="btn" id="aCopy">复制提示词</button></div>
    <textarea id="aPrompt" readonly style="margin-top:8px"></textarea>
    <textarea id="aJson" placeholder='[{"topic":"te.past_simple","grade":6,"difficulty":2,"type":"choice","stem":"...","choices":[["A","..."],["B","..."]],"answer":"A","explain":"..."}]'></textarea>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="aCheck">质检并导入</button><button class="btn" id="aExport">导出我导入的题</button><span class="small muted" id="aCount"></span></div>
  </div>
  <div id="aResult"></div>
</section>
</main>

<script>
const KB = window.KB;
const CAN_PRINT = !window.KB_HOSTED;   // 托管页面不允许打印，只保留卷面视图
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T = Object.fromEntries(KB.topics.map(t => [t.id, t]));
const ST = KB.exam_stats.topics;
const GRADES = KB.levels.grades;
const DOMAINS = [...new Set(KB.topics.map(t => t.domain))];
const COLORS = {'语音':'#8e6cc4','词汇':'#2f9e8f','词法':'#2f6fde','时态':'#d2493e','句法':'#d98a1e','交际':'#c4508e','阅读':'#4f8a2e','写作':'#6b6f76'};
const prereq = id => KB.dependencies.filter(d => d.topicId === id);
const unlocks = id => KB.dependencies.filter(d => d.prerequisiteId === id);
const related = id => KB.exam_stats.related.filter(r => r.a === id || r.b === id);
const tierName = {3:'必考',2:'常考',1:'偶考'};
const gname = g => GRADES[g].name;

// ---------- 本地存储（每个浏览器各自保存，换设备不会同步） ----------
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
const extraQs = () => store.get('kb.extraQuestions', []);
const allQs = () => KB.questions.concat(extraQs());
const who = () => ($('#student').value.trim() || '未命名');
$('#student').value = store.get('kb.student', '');
$('#student').onchange = () => { store.set('kb.student', $('#student').value.trim()); renderGraphStyle(); };
const mastery = () => store.get('kb.mastery.' + who(), {});           // {topicId: {r, w}}
function record(results) {
  const m = mastery();
  for (const {q, ok} of results) { const x = m[q.topic] ||= {r: 0, w: 0}; ok ? x.r++ : x.w++; }
  store.set('kb.mastery.' + who(), m);
}

// ---------- 年级匹配（与 scripts/kb.py 相同的规则） ----------
function recDiff(g, tg) { const gap = g - tg; return gap < 0 ? [] : gap === 0 ? [1, 2] : gap === 1 ? [1, 2, 3] : [2, 3]; }
function fits(q, g) { return q.grade <= g && q.grade >= g - 1 && recDiff(g, T[q.topic].grade).includes(q.difficulty); }
function pick(pool, n, used = {}) {
  const out = [], left = pool.slice();
  while (left.length && out.length < n) {
    const w = left.map(q => (1 + 2 * (ST[q.topic]?.paperRate || 0)) / (1 + 3 * (used[q.topic] || 0)));
    let r = Math.random() * w.reduce((a, b) => a + b), i = 0;
    while ((r -= w[i]) > 0) i++;
    const q = left.splice(i, 1)[0]; used[q.topic] = (used[q.topic] || 0) + 1;
    if (q.passage) {   // 短文题整组带出
      const group = left.filter(x => x.passage === q.passage);
      group.forEach(x => left.splice(left.indexOf(x), 1));
      out.push(q, ...group);
    } else out.push(q);
  }
  return out;
}

// ---------- 知识图谱 ----------
let cy;
function layout() {
  const pos = {}, colW = 330, rowH = 50, lanePad = 34; let y = 0;
  for (const d of DOMAINS) {
    const cells = {}; KB.topics.filter(t => t.domain === d).forEach(t => (cells[t.grade] ||= []).push(t));
    const rows = Math.max(...Object.values(cells).map(c => Math.ceil(c.length / 2)));
    for (const [g, ts] of Object.entries(cells))
      ts.forEach((t, i) => pos[t.id] = {x: (g - 3) * colW + (i % 2) * 150, y: y + Math.floor(i / 2) * rowH});
    y += rows * rowH + lanePad;
  }
  return pos;
}
function shortName(n) { n = n.split('：')[0]; return n.length > 12 ? n.slice(0, 11) + '…' : n; }
function initGraph() {
  if (!window.cytoscape) { $('#cy').innerHTML = '<p class="muted" style="padding:16px">图谱组件需要联网加载（cdnjs）。离线时仍可使用出题和诊断功能。</p>'; return; }
  const pos = layout();
  const els = KB.topics.map(t => ({data: {id: t.id, label: shortName(t.name), domain: t.domain, size: 14 + 34 * (ST[t.id]?.paperRate || 0)}, position: pos[t.id]}))
    .concat(KB.dependencies.map((d, i) => ({data: {id: 'e' + i, source: d.prerequisiteId, target: d.topicId, kind: d.strength}})))
    .concat(KB.exam_stats.related.map((r, i) => ({data: {id: 'r' + i, source: r.a, target: r.b, kind: 'related'}})))
    .concat(Object.keys(GRADES).map(g => ({data: {id: 'hdr' + g, label: GRADES[g].name}, position: {x: (g - 3) * 330 + 75, y: -50}, classes: 'hdr', selectable: false, grabbable: false})));
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  cy = cytoscape({container: $('#cy'), elements: els, layout: {name: 'preset'}, wheelSensitivity: .25, minZoom: .2, maxZoom: 3,
    style: [
      {selector: 'node', style: {'background-color': e => COLORS[e.data('domain')] || '#888', width: 'data(size)', height: 'data(size)', label: 'data(label)',
        'font-size': 11, color: dark ? '#e8e6e1' : '#1f2328', 'text-valign': 'bottom', 'text-margin-y': 3, 'text-wrap': 'wrap', 'text-max-width': 130}},
      {selector: 'node.hdr', style: {'background-opacity': 0, width: 1, height: 1, 'font-size': 18, 'font-weight': 600, 'text-valign': 'center', color: dark ? '#9a9ea6' : '#6b6f76', events: 'no'}},
      {selector: 'edge', style: {width: 1.2, 'line-color': '#8a8f98', 'target-arrow-color': '#8a8f98', 'target-arrow-shape': 'triangle', 'arrow-scale': .7, 'curve-style': 'bezier', opacity: .55}},
      {selector: 'edge[kind="soft"]', style: {'line-style': 'dashed', 'line-color': '#b8bcc4', 'target-arrow-color': '#b8bcc4'}},
      {selector: 'edge[kind="related"]', style: {'line-style': 'dotted', 'line-color': '#e08a2c', 'target-arrow-shape': 'none', width: 1.6}},
      {selector: '.faded', style: {opacity: .08}},
      {selector: 'node.hl', style: {'border-width': 3, 'border-color': '#f5b400'}},
      {selector: 'edge.hl', style: {opacity: 1, width: 2.2}},
      {selector: '.hidden', style: {display: 'none'}},
    ]});
  cy.fit(undefined, 20);
  cy.on('tap', 'node', e => T[e.target.id()] && showTopic(e.target.id()));
  cy.on('tap', e => { if (e.target === cy) cy.elements().removeClass('faded hl'); });
  renderGraphStyle();
}
const domainOn = Object.fromEntries(DOMAINS.map(d => [d, true]));
$('#domainChips').innerHTML = DOMAINS.map(d => `<span class="chip" data-d="${d}" style="border-color:${COLORS[d]}">${d}</span>`).join('');
$('#domainChips').onclick = e => { const d = e.target.dataset.d; if (!d) return; domainOn[d] = !domainOn[d]; e.target.classList.toggle('off'); renderGraphStyle(); };
['onlyCore', 'showRelated', 'showMastery'].forEach(id => $('#' + id).onchange = renderGraphStyle);
$('#search').oninput = () => { const s = $('#search').value.trim(); if (!s || !cy) return; const t = KB.topics.find(t => t.name.includes(s) || t.id.includes(s)); if (t) showTopic(t.id); };
function masteryColor(id) {
  const x = mastery()[id]; if (!x) return '#c9ccd1';
  const a = x.r / (x.r + x.w); return a >= .8 ? '#2e9d5b' : a >= .5 ? '#d99a1e' : '#d2493e';
}
function renderGraphStyle() {
  if (!cy) return;
  const core = $('#onlyCore').checked, rel = $('#showRelated').checked, mc = $('#showMastery').checked;
  cy.nodes().not('.hdr').forEach(n => {
    const t = T[n.id()];
    n.toggleClass('hidden', !domainOn[t.domain] || (core && ST[t.id]?.tier !== 3));
    n.style('background-color', mc ? masteryColor(t.id) : COLORS[t.domain]);
  });
  cy.edges('[kind="related"]').toggleClass('hidden', !rel);
}
function topicLink(id) { return `<span class="link" data-topic="${id}">${esc(T[id].name)}</span>`; }
document.addEventListener('click', e => { const id = e.target.dataset?.topic; if (id) { switchTab('graph'); showTopic(id); } });
function showTopic(id) {
  const t = T[id], s = ST[id] || {}, qs = allQs().filter(q => q.topic === id), m = mastery()[id];
  if (cy) {
    cy.elements().removeClass('hl').addClass('faded');
    const n = cy.getElementById(id), nb = n.closedNeighborhood();
    nb.removeClass('faded').addClass('hl');
    cy.animate({center: {eles: n}, duration: 250});
  }
  const byD = [1, 2, 3].map(d => qs.filter(q => q.difficulty === d).length);
  $('#panel').innerHTML = `
    <h2>${esc(t.name)}</h2>
    <div class="small"><span class="chip" style="cursor:default;background:${COLORS[t.domain]};color:#fff">${t.domain}·${t.sub}</span>
      <span class="chip tier${s.tier || 1}" style="cursor:default">${tierName[s.tier || 1]} ${Math.round((s.paperRate || 0) * 100)}% 的真卷出现</span>
      <span class="chip" style="cursor:default">首学：${gname(t.grade)}</span>${t.stretch ? '<span class="chip" style="cursor:default">衔接/拓展</span>' : ''}</div>
    <p>${esc(t.desc)}</p>
    <div class="small muted">课标：${esc(t.std)}</div>
    ${m ? `<p class="small">${esc(who())}：答对 ${m.r} / ${m.r + m.w}</p>` : ''}
    <h3>掌握标准</h3><ul>${t.evidence.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <h3>孩子常见错误</h3><ul>${t.errors.map(x => `<li>${esc(x)}</li>`).join('')}</ul>

  const cloze = groups.filter(gr => gr[0].topic === 'rd.cloze'), pfill = groups.filter(gr => gr[0].topic === 'rd.passage_fill');
  const reading = shuffle(groups.filter(gr => !['rd.cloze', 'rd.passage_fill'].includes(gr[0].topic) && gr[0].type === 'choice'));

    ['阅读理解', read.flat()],

  const ai = e ? `<p><b>优点：</b>${esc(e.good || '')}</p>${e.missing ? `<p><b>漏掉的要点：</b>${esc(e.missing)}</p>` : ''}

function makeComment(rate, n, weak, strong, roots, by) {
  const lv = rate >= 90 ? '整体掌握很扎实' : rate >= 75 ? '整体掌握较好，有个别薄弱点' : rate >= 60 ? '基础基本具备，但有几处明显漏洞' : '基础还不稳，需要从先修知识点补起';
  let s = `<p>本次共 ${n} 题，正确率 ${rate}%，${lv}。</p>`;
  if (strong.length) s += `<p><b>掌握较好：</b>${strong.slice(0, 6).map(id => esc(T[id].name)).join('、')}。</p>`;
  for (const id of weak.sort((a, b) => (ST[b]?.paperRate || 0) - (ST[a]?.paperRate || 0)).slice(0, 5)) {
    const t = T[id], x = by[id];
    s += `<p><b>${x.n === 1 ? '待确认' : '需要加强'}：${esc(t.name)}</b>（${x.r}/${x.n}${ST[id]?.tier === 3 ? '，小升初必考' : ''}${x.n === 1 ? '，只考了 1 题，建议再练 2~3 题确认' : ''}）。这类题孩子常见的错误是：${t.errors.slice(0, 2).map(esc).join('；')}。建议：${esc(t.tips)}`;
    if (roots[id]) s += ` <span class="res-bad">根因提示：</span>先修点「${roots[id].map(p => esc(T[p].name)).join('」「')}」也不扎实，建议先复习它再回到本点。`;
    s += '</p>';
  }
  if (!weak.length) s += '<p>没有明显薄弱点，可以升高一个年级或难度继续练习。</p>';
  return s;
}

let pr = null;
function startPractice(ids) {

function nextPractice() {
  while (pr.queue.length) {
    const id = pr.queue[0], g = Math.max(pr.g, T[id].grade);
    const d = pr.d[id] ??= Math.min(...(recDiff(g, T[id].grade).length ? recDiff(g, T[id].grade) : [1]));
    const cand = allQs().filter(q => q.topic === id && q.type !== 'writing' && q.grade <= g && !pr.seen.has(q.id));
    const q = cand.sort((a, b) => Math.abs(a.difficulty - d) - Math.abs(b.difficulty - d) || b.grade - a.grade)[0];
    const doneHere = pr.done.filter(r => r.q.topic === id).length;
    if (!q || doneHere >= 4) { pr.queue.shift(); pr.streak = 0; continue; }
    pr.cur = q; pr.seen.add(q.id); return renderPractice();

  const ok = pr.done.filter(r => r.ok).length;
  $('#practiceBox').innerHTML = `<div class="card"><h3 style="margin-top:0">练习完成</h3><p>共 ${pr.done.length} 题，答对 ${ok} 题。结果已记入 ${esc(who())} 的掌握情况，可以在知识图谱里勾选「按掌握情况着色」查看。</p></div>`;
}
function renderPractice() {

    ${q.passage ? `<div class="passage">${esc(q.passage)}</div>` : ''}<div class="q">${qHtml(q, 0, 'answer')}</div>

  $('#practiceBox').scrollIntoView({behavior: 'smooth'});

    const given = q.type === 'choice' ? document.querySelector('input[name="q0"]:checked')?.value : document.querySelector('[data-fill="0"]').value;

const WL = KB.wordlists, LV = KB.levels;
const IRR = {}; Object.entries(WL.irregular).forEach(([b, fs]) => fs.forEach(f => IRR[f] = b));

  for (const tok of text.match(/[A-Za-z]+(?:[-'][A-Za-z]+)*/g) || []) {

  if (q.grade < t.grade) errs.push(`知识点首学在${gname(t.grade)}，不能出给${gname(q.grade)}`);

  if (bad.length / words > GRADES[q.grade].newWords) warns.push('可能超纲的词：' + [...new Set(bad)].join(', '));
  const longest = Math.max(...q.stem.split(/[.!?—]/).map(s => s.trim().split(/\s+/).filter(Boolean).length));
  if (!q.passage && longest > GRADES[q.grade].maxWords + 2) warns.push(`句子 ${longest} 词，超过${gname(q.grade)}建议长度`);
  if (!recDiff(q.grade, t.grade).includes(q.difficulty)) warns.push(`${gname(q.grade)}做这个点推荐难度 ${recDiff(q.grade, t.grade).join('、')}`);
  if (allQs().some(x => x.stem === q.stem && JSON.stringify(x.choices) === JSON.stringify(q.choices))) errs.push('与题库已有题重复');
  return {errs, warns};
}
$('#aCheck').onclick = () => {
  let arr;
  try {
    const raw = $('#aJson').value.trim(), v = raw.startsWith('[') ? parseArr(raw) : parseObj(raw);
    arr = normalizeAi(v, {g: +$('#aGrade').value, d: +$('#aDiff').value, topic: $('#aKind').value === 'passage' ? 'rd.detail' : $('#aTopic').value, theme: $('#aTheme').value, mat: $('#aMat').value});
  } catch (e) { $('#aResult').innerHTML = `<p class="res-bad">JSON 格式不对：${esc(e.message)}</p>`; return; }
  importQs(arr);
};
function importQs(arr, extraErr = null, source = 'AI') {
  const kept = [], rows = [];
  arr.forEach((q, i) => {
    q.grade = +q.grade; q.difficulty = +q.difficulty;
    const {errs, warns} = checkQ(q);
    const x = !errs.length && extraErr?.(q, i); if (x) errs.push(x);
    rows.push(`<tr><td>${i + 1}</td><td>${q.type === 'writing' ? `<b>${esc(q.title)}</b><div class="small">${esc(q.stem)}</div><div class="passage">${esc(q.sample || '')}</div>` : ''}${q.passage && (i === 0 || arr[i - 1].passage !== q.passage) ? passageHtml(q) : ''}${q.type === 'writing' ? '' : esc(q.stem || '')}${q.choices ? `<div class="small muted">${q.choices.map(c => esc(c[0] + '. ' + c[1])).join('　')}</div>` : ''}${q.type === 'writing' ? '' : `<div class="small muted">答案：${esc(Array.isArray(q.answer) ? q.answer.join(' / ') : q.answer)}　${esc(q.explain || '')}</div>`}</td><td>${errs.length ? `<span class="res-bad">未导入：${esc(errs.join('；'))}</span>` : warns.length ? `<span style="color:var(--mid)">已导入，请人工核对：${esc(warns.join('；'))}</span>` : '<span class="res-ok">通过</span>'}</td></tr>`);
    if (!errs.length) kept.push({...q, id: 'ai-' + Date.now() + '-' + i, source, review: warns.length ? '待核' : '机检通过'});
  });
  store.set('kb.extraQuestions', extraQs().concat(kept));
  $('#aResult').innerHTML = `<div class="card"><p>导入 ${kept.length} / ${arr.length} 题。机检查格式、年级词汇和句长${extraErr ? '，盲解复核查答案是否唯一' : ''}；<b>入库前仍建议老师看一遍</b>。</p>
    <div class="scroll"><table>${rows.join('')}</table></div>
    ${kept.length ? `<div class="row" style="margin-top:8px"><button class="btn" onclick="startPractice(['${esc(arr[0].topic)}'])" ${arr[0].type === 'writing' ? 'hidden' : ''}>用这些题练一练</button></div>` : ''}</div>`;
  updateCount(); renderStats();
}
$('#aExport').onclick = () => {
  $('#aResult').innerHTML = `<p class="small">下面是你导入的 ${extraQs().length} 道题（JSON），全选复制后可以发给我合并进正式题库：</p><textarea id="aOut" readonly>${esc(JSON.stringify(extraQs(), null, 1))}</textarea>`;
  $('#aOut').select();
};
// ---------- 直接调用大模型 ----------
const PRESETS = {
  'DeepSeek V4 Pro（质量优先）': ['openai', 'https://api.deepseek.com/v1', 'deepseek-v4-pro'],
  'DeepSeek Flash（速度优先）': ['openai', 'https://api.deepseek.com/v1', 'deepseek-flash'],
  '通义千问': ['openai', 'https://dashscope.aliyuncs.com/compatible-mode/v1', 'qwen-plus'],
  'Kimi': ['openai', 'https://api.moonshot.cn/v1', 'moonshot-v1-8k'],
  '智谱 GLM': ['openai', 'https://open.bigmodel.cn/api/paas/v4', 'glm-4-flash'],
  '豆包': ['openai', 'https://ark.cn-beijing.volces.com/api/v3', ''],
  'OpenAI': ['openai', 'https://api.openai.com/v1', 'gpt-4o-mini'],
  'Claude': ['anthropic', 'https://api.anthropic.com', 'claude-opus-5-5'],
};
let sampleFn = null, proxy = null, ctl = null;
const llmCfg = () => store.get('kb.llm', {prov: '', base: '', model: '', key: ''});
function saveLlm() { store.set('kb.llm', {prov: $('#mProv').value, base: $('#mBase').value.trim(), model: $('#mModel').value.trim(), key: $('#mKey').value.trim()}); }
function renderModelUi() {
  const p = $('#mProv').value, custom = p === 'openai' || p === 'anthropic';
  $('#mFields').hidden = !custom; $('#mPreset').hidden = !custom;
  $('#mPreset').innerHTML = '<option value="">选常用接口…</option>' + Object.entries(PRESETS).filter(([, v]) => v[0] === p).map(([k]) => `<option>${k}</option>`).join('');
  $('#mNote').textContent = {
    claude: '用的是你在 claude.ai 的账号额度。第一次出题时页面会请你允许它使用 Claude。',
    server: `密钥只在本机 llm.json 里，浏览器拿不到。当前模型：${proxy?.model || ''}`,
    openai: proxy ? '通过本机 kb.py serve 转发。API Key 只保存在这台电脑的浏览器里。' : 'API Key 只保存在这台电脑的浏览器里。有的接口不允许浏览器直接调用，出错时请改用 python3 scripts/kb.py serve 打开本页。',
    anthropic: proxy ? '通过本机 kb.py serve 转发。API Key 只保存在这台电脑的浏览器里。' : 'API Key 只保存在这台电脑的浏览器里。',
  }[p];
}
async function initModels() {
  const opt = v => $(`#mProv option[value="${v}"]`);
  if (window.KB_HOSTED) {   // 托管页面禁止访问外部网址，只能用内置 Claude
    opt('openai').disabled = opt('anthropic').disabled = opt('server').disabled = true;
    opt('openai').textContent += '（只在本地版可用）'; opt('anthropic').textContent += '（只在本地版可用）'; opt('server').hidden = true;
  } else {
    opt('claude').hidden = true;
    if (location.protocol.startsWith('http')) {
      try { const r = await fetch('/api/llm-config'); if (r.ok) proxy = await r.json(); } catch {}
    }
    if (!proxy?.configured) { opt('server').disabled = true; opt('server').textContent += '（未配置）'; }
  }
  const c = llmCfg();
  $('#mBase').value = c.base || ''; $('#mModel').value = c.model || ''; $('#mKey').value = c.key || '';
  const ok = v => v && !opt(v).disabled && !opt(v).hidden;
  $('#mProv').value = ok(c.prov) ? c.prov : ['claude', 'server', 'openai'].find(ok);
  renderModelUi();
  if (window.KB_HOSTED && window.claude?.use) {
    sampleFn = await claude.use('sample');
    if (!sampleFn) { opt('claude').disabled = true; opt('claude').textContent += '（当前环境不可用）'; $('#mGo').disabled = true; $('#mNote').textContent = '这里用不了内置 Claude，可以改用下面的“复制提示词”。'; }
  }
}
$('#mProv').onchange = () => { saveLlm(); renderModelUi(); };
$('#mPreset').onchange = () => { const v = PRESETS[$('#mPreset').value]; if (!v) return; $('#mBase').value = v[1]; $('#mModel').value = v[2]; saveLlm(); if (!v[2]) $('#mModel').placeholder = '填推理接入点 ID'; };
['mBase', 'mModel', 'mKey'].forEach(id => $('#' + id).onchange = saveLlm);

async function postJson(url, body, headers = {}) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json', ...headers}, body: JSON.stringify(body), signal: ctl.signal});
  const t = await r.text(); let j; try { j = JSON.parse(t); } catch { j = null; }
  if (!r.ok) throw new Error(`接口返回 ${r.status}：${(j?.error?.message || j?.error || t).toString().slice(0, 200)}`);
  return j;
}
async function callModel(prompt) {
  const p = $('#mProv').value;
  if (p === 'claude') {
    try { return (await sampleFn(prompt, {signal: ctl.signal, cache: false})).text; }
    catch (e) { throw new Error({not_granted: '你没有允许这个页面使用 Claude', rate_limited: '调用太频繁或额度用完，请稍后再试', cancelled: '已停止', sampling_disabled: '这个账号不能在页面里使用 Claude'}[e.code] || e.message || String(e)); }
  }
  if (p === 'server') return (await postJson('/api/llm', {prompt})).text;
  const cfg = {provider: p, base_url: $('#mBase').value.trim(), model: $('#mModel').value.trim(), api_key: $('#mKey').value.trim()};
  if (!cfg.api_key || (p === 'openai' && (!cfg.base_url || !cfg.model))) throw new Error('请先填写接口地址、模型名和 API Key');
  if (proxy) return (await postJson('/api/llm', {prompt, cfg})).text;
  try {
    if (p === 'openai') return (await postJson(cfg.base_url.replace(/\/$/, '') + '/chat/completions', {model: cfg.model, messages: [{role: 'user', content: prompt}]}, {Authorization: 'Bearer ' + cfg.api_key})).choices[0].message.content;
    const r = await postJson((cfg.base_url || 'https://api.anthropic.com').replace(/\/$/, '') + '/v1/messages',
      {model: cfg.model || 'claude-opus-5-5', max_tokens: 16000, fallbacks: 'default', messages: [{role: 'user', content: prompt}]},
      {'x-api-key': cfg.api_key, 'anthropic-version': '2023-06-01', 'anthropic-beta': 'server-side-fallback-2026-07-01', 'anthropic-dangerous-direct-browser-access': 'true'});
    if (r.stop_reason === 'refusal') throw new Error('模型拒绝了这次请求');
    return r.content.filter(b => b.type === 'text').map(b => b.text).join('');
  } catch (e) {
    if (e.name === 'TypeError') throw new Error('浏览器无法直接连这个接口（多半是跨域限制）。请在项目目录运行 python3 scripts/kb.py serve，再打开 http://localhost:8765');
    throw e;
  }
}
const parseObj = t => { const m = String(t).match(/\{[\s\S]*\}/); if (!m) throw new Error('模型没有返回 JSON'); return JSON.parse(m[0]); };
function normalizeAi(v, ctx) {   // 单题数组 / 篇章对象 / 作文对象 → 题目数组
  const {g, d, topic, theme, mat} = ctx;
  if (Array.isArray(v)) return v.filter(q => q && typeof q === 'object').map(q => ({...q, topic: q.topic || topic, grade: +(q.grade || g), difficulty: +(q.difficulty || d)}));
  if (v.passage && Array.isArray(v.questions)) {
    const url = (mat || '').match(/https?:\/\/\S+/)?.[0];
    const hasTitleQ = v.questions.some(q => /title/i.test(q.stem || ''));
    return v.questions.map(q => ({...q, topic: T[q.topic] && q.topic.startsWith('rd.') ? q.topic : 'rd.detail', type: q.type || 'choice', grade: g, difficulty: d,
      passage: String(v.passage).split('\n').map(x => x.trim()).filter(Boolean).join('\n'), theme: v.theme || theme, title: hasTitleQ ? '' : (v.title || ''), source: url || (mat ? 'AI 根据素材改写' : 'AI 原创')}));
  }
  if (v.sample) return [{topic, grade: g, difficulty: d, type: 'writing', title: v.title || '', stem: v.stem || '', require: v.require || '',
    points: v.points || [], minWords: +v.minWords || 60, phrases: v.phrases || '', sample: v.sample, explain: ''}];
  throw new Error('看不懂这段 JSON：既不是题目数组，也不是篇章或作文');
}
const parseArr = t => { const m = String(t).match(/\[[\s\S]*\]/); if (!m) throw new Error('模型没有返回题目 JSON'); return JSON.parse(m[0]); };
function blindPrompt(qs, g) {
  const shared = qs.length && qs.every(q => q.passage && q.passage === qs[0].passage) ? qs[0].passage : '';
  const lines = qs.map((q, i) => `${i + 1}. ${q.stem}${q.passage && !shared ? '\n（短文）' + q.passage : ''}${(q.choices || []).map(c => `\n   ${c[0]}. ${c[1]}`).join('')}`);
  if (shared) lines.unshift('短文：\n' + shared + '\n');
  return `你是认真的英语老师。下面是给${gname(g)}学生的英语题，请独立作答，每题给一个最佳答案。选择题回答选项字母；填空题回答要填的内容，多个空用逗号隔开。如果某题没有正确答案或不止一个正确答案，answer 写 "?"，并在 note 里说明原因。
只输出 JSON 数组：[{"i":1,"answer":"B","note":""}]

${lines.join('\n')}`;
}
function blindErr(q, a) {
  if (!a) return '复核没有作答';
  const got = String(a.answer ?? '').trim();
  if (got === '?') return '复核认为有歧义：' + (a.note || '');
  const ok = q.type === 'choice' ? got.slice(0, 1).toUpperCase() === q.answer : isRight(q, got);
  return ok ? null : `复核作答为 ${got}，与给定答案不一致`;
}
$('#mStop').onclick = () => ctl?.abort();
$('#mGo').onclick = async () => {
  makePrompt();
  const k = $('#aKind').value, t = k === 'passage' ? 'rd.detail' : $('#aTopic').value, g = +$('#aGrade').value, d = +$('#aDiff').value;
  if (k !== 'passage' && !recDiff(g, T[t].grade).length) { $('#mStatus').textContent = `「${T[t].name}」首学在${gname(T[t].grade)}，${gname(g)}还没学。`; return; }
  ctl = new AbortController(); $('#mGo').disabled = true; $('#mStop').hidden = false;
  try {
    $('#mStatus').textContent = '正在出题…（快速模型约半分钟，DeepSeek-V4-Pro 等推理模型要 1~3 分钟）';
    const reply = await callModel($('#aPrompt').value);
    const arr = normalizeAi(k === 'single' ? parseArr(reply) : parseObj(reply), {g, d, topic: t, theme: $('#aTheme').value, mat: $('#aMat').value});
    if (k === 'single') arr.forEach(q => Object.assign(q, {topic: t, grade: g, difficulty: d}));
    let solved = {};
    if ($('#mVerify').checked && k !== 'writing' && arr.length) {
      $('#mStatus').textContent = `出了 ${arr.length} 题，正在盲解复核…`;
      parseArr(await callModel(blindPrompt(arr, g))).forEach(a => solved[+a.i] = a);
    }
    importQs(arr, $('#mVerify').checked && k !== 'writing' ? (q, i) => blindErr(q, solved[i + 1]) : null, 'AI·' + ($('#mProv').value === 'claude' ? 'Claude' : $('#mModel').value || proxy?.model || $('#mProv').value));
    $('#mStatus').textContent = '完成';
  } catch (e) {
    $('#mStatus').innerHTML = `<span class="res-bad">${esc(e.message || e)}</span>`;
  } finally { $('#mGo').disabled = false; $('#mStop').hidden = true; }
};

function updateCount() { $('#aCount').textContent = `浏览器里已导入 ${extraQs().length} 道 AI 题（只保存在本机这个浏览器）`; }

// ---------- 启动 ----------
function switchTab(name) {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + name));
  if (name === 'graph' && cy) { cy.resize(); renderGraphStyle(); }
}
$('#nav').onclick = e => e.target.dataset.tab && switchTab(e.target.dataset.tab);
renderStats(); initGraph(); makePrompt(); updateCount(); initModels();
</script>
