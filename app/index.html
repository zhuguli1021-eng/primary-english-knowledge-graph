<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小学英语知识图谱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="data.js"></script>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--muted:#6b6f76;--line:#e3e1da;--accent:#2f6fde;--good:#2e9d5b;--mid:#d99a1e;--bad:#d2493e;--chip:#efede7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#202226;--ink:#e8e6e1;--muted:#9a9ea6;--line:#33363c;--accent:#6f9dff;--chip:#2a2d33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--card:#202226;--ink:#e8e6e1;--muted:#9a9ea6;--line:#33363c;--accent:#6f9dff;--chip:#2a2d33;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header h1{font-size:17px;margin:0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.who{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
.scroll{overflow-x:auto}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--chip);font-size:12px;margin:2px 4px 2px 0;cursor:pointer;border:1px solid transparent}
.chip.off{opacity:.35}
.tier3{background:#fde3df;color:#9b2c22}.tier2{background:#fdf0d5;color:#8a5a00}.tier1{background:var(--chip);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tier3{background:#4a2422;color:#ffb4aa}:root:not([data-theme="light"]) .tier2{background:#3f3418;color:#ffd27a}}
#graphWrap{display:grid;grid-template-columns:1fr 380px;gap:14px}
#cy{height:72vh;min-height:480px;background:var(--card);border:1px solid var(--line);border-radius:12px}
#panel{height:72vh;min-height:480px;overflow:auto}
@media (max-width:900px){#graphWrap{grid-template-columns:1fr}#cy{height:60vh}#panel{height:auto}}
#panel h2{font-size:18px;margin:0 0 6px}
#panel h3{font-size:14px;margin:14px 0 4px;color:var(--muted)}
#panel ul{margin:0;padding-left:18px}
.link{color:var(--accent);cursor:pointer}
.q{border-top:1px dashed var(--line);padding:12px 0}
.q:first-child{border-top:0}
.qhead{display:flex;gap:8px;align-items:baseline}
.qnum{font-weight:600;min-width:2em}
.meta{font-size:12px;color:var(--muted)}
.opts label{display:block;padding:3px 6px;border-radius:6px;cursor:pointer}
.opts label:hover{background:var(--chip)}
.essay{width:100%;min-height:180px;font:15px/1.7 inherit;font-family:inherit}
.lines div{border-bottom:1px solid var(--line);height:30px}
.sec{font-weight:600;margin:18px 0 4px;padding-top:10px;border-top:2px solid var(--line)}
.ptag{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.passage{white-space:pre-wrap;background:var(--chip);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}
.res-ok{color:var(--good)}.res-bad{color:var(--bad)}
.explain{font-size:13px;color:var(--muted);margin-top:4px}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.mark button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 10px;cursor:pointer;color:var(--ink)}
.mark button.sel.ok{background:var(--good);color:#fff}.mark button.sel.bad{background:var(--bad);color:#fff}
textarea{width:100%;min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid}
.steps-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.steps-bar button{flex:1;min-width:150px;text-align:left;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.steps-bar button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.steps-bar button small{display:block;font-size:11px;opacity:.8}
.badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:500;margin-right:4px}
.b-real{background:#e3f5ea;color:#1b6e3c}.b-cur{background:#e6eefc;color:#1f52a8}.b-draft{background:#fff1d6;color:#945800;border:1px solid #f0c36d}.b-ok{background:#dff4f0;color:#11695c}.b-warn{background:#fde3df;color:#9b2c22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b-real{background:#1c3b29;color:#8ee4af}:root:not([data-theme="light"]) .b-cur{background:#1f2f4d;color:#9ec0ff}:root:not([data-theme="light"]) .b-draft{background:#423112;color:#ffd479}:root:not([data-theme="light"]) .b-ok{background:#173b36;color:#84e3d4}:root:not([data-theme="light"]) .b-warn{background:#4a2422;color:#ffb4aa}}
.bp-table input[type="number"]{width:58px;text-align:center;padding:3px 4px}
.sec-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sec-tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit}
.sec-tabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.qcard{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--card)}
.qcard.draft{border-left:4px solid var(--mid)}
.qcard.bad{border-left:4px solid var(--bad)}
.exam-hdr{text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.exam-hdr h2{margin:0 0 4px;font-size:21px}
@media print{header,nav,.noprint{display:none!important}main{padding:0;max-width:none}.card{border:0;padding:0;margin:0}body{background:#fff;color:#000;font-size:13.5px}.q{page-break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>小学英语知识图谱</h1>
  <nav id="nav">
    <button data-tab="graph" class="on">知识图谱</button>
    <button data-tab="paper">出题组卷</button>
    <button data-tab="report">诊断与训练</button>
    <button data-tab="ai">AI 出题</button>
  </nav>
  <div class="who">学生 <input id="student" size="8" placeholder="姓名"></div>
</header>
<main>

<section id="tab-graph" class="tab on">
  <div class="card row small noprint">
    <span class="muted">领域</span><span id="domainChips"></span>
    <label><input type="checkbox" id="onlyCore"> 只看必考</label>
    <label><input type="checkbox" id="showRelated" checked> 显示真题共考关联</label>
    <label><input type="checkbox" id="showMastery"> 按当前学生掌握情况着色</label>
    <input id="search" placeholder="搜索知识点" size="10">
  </div>
  <div class="legend small noprint" style="margin:-6px 0 8px 4px">
    <span><i style="border-color:#8a8f98"></i>必须先学（hard）</span>
    <span><i style="border-color:#b8bcc4;border-top-style:dashed"></i>建议先学（soft）</span>
    <span><i style="border-color:#e08a2c;border-top-style:dotted"></i>真题常一起考</span>
    <span>圆圈越大 = 真题考频越高；横向是首学年级（7 = 小升初衔接）</span>
  </div>
  <div id="graphWrap">
    <div id="cy"></div>
    <div id="panel" class="card"><p class="muted">点一个知识点，查看说明、易错点、先修关系和真题例句。</p><div id="stats"></div></div>
  </div>
</section>

<section id="tab-paper" class="tab">
  <div class="steps-bar noprint" id="wbSteps">
    <button data-step="1" class="on"><b>第一步 · 定蓝图</b><small>CPP 单元映射 · 双向细目表</small></button>
    <button data-step="2"><b>第二步 · 抽素材</b><small>语料库真题优先 · 缺题 AI 补</small></button>
    <button data-step="3"><b>第三步 · 分板块把关</b><small>一次一板块 · 单题可重出</small></button>
    <button data-step="4"><b>第四步 · 人工校验</b><small>答案/歧义/超纲/查重 · 初稿生效</small></button>
    <button data-step="5"><b>第五步 · 打印成卷</b><small>学生卷 · 答案详解卷 · 作答诊断</small></button>
  </div>
  <div id="wbStep1" class="wb-pane">
    <div class="card noprint">
      <div class="row">
        <label>映射标准
          <select id="bpStd">
            <option value="cpp">按 CPP 单元目标卡 V2.1（推荐）</option>
            <option value="exam">按本年级高频真卷考点</option>
            <option value="custom">自由勾选指定知识点 / 领域</option>
          </select>
        </label>
        <span id="bpCppBar" class="row">
          <label>CPP 级别 <select id="bpCppLv"></select></label>
        </span>
        <label>词表/对标年级 <select id="pGrade"></select></label>
        <button class="btn" id="bpReset">重置推荐题量</button>
      </div>
      <div id="bpUnitChips" style="margin-top:8px"></div>
      <div id="bpUnitSummary" class="small muted" style="margin-top:6px"></div>
      <div id="bpCustomPicker" hidden style="margin-top:8px"></div>
    </div>
    <div class="card noprint">
      <div class="row" style="margin-bottom:8px">
        <h3 style="margin:0">双向细目表（纵轴：知识点 · 横轴：题型、题量与分值）</h3>
        <span style="flex:1"></span>
        <select id="bpAddTopic" style="max-width:240px"></select>
        <button class="btn" id="bpAddRow">+ 加入知识点行</button>
      </div>
      <div class="scroll"><table class="bp-table" id="bpTable"></table></div>
      <div class="row" style="margin-top:12px">
        <span id="bpSummary" style="font-weight:600"></span>
        <span style="flex:1"></span>
        <button class="btn primary" id="bpDrawBtn">下一步：严格从语料库抽真题 →</button>
      </div>
    </div>
  </div>
  <div id="wbStep2" class="wb-pane" hidden></div>
  <div id="wbStep3" class="wb-pane" hidden></div>
  <div id="wbStep4" class="wb-pane" hidden></div>
  <div id="wbStep5" class="wb-pane" hidden><div id="paperBox"></div></div>
</section>

<section id="tab-report" class="tab">
  <div id="reportBox"><div class="card muted">先在「出题组卷」生成一套题，让孩子在线作答或由老师录入对错，这里会给出诊断、点评和针对性练习。</div></div>
  <div id="practiceBox"></div>
</section>

<section id="tab-ai" class="tab">
  <div class="card">
    <h3 style="margin-top:0">1. 选知识点、年级、题型与难度（自动匹配语料库与真题母题）</h3>
    <div class="row">
      <select id="aKind"><option value="single">单项题（仿写单句/对话真题）</option><option value="passage">篇章题（完形 / 阅读 / 语篇填空）</option><option value="writing">书面表达（仿写真题作文）</option></select>
      <select id="aQtype"></select>
      <select id="aTheme" hidden><option>应用文</option><option>科普跨学科</option><option>中国文化</option><option>记叙情感</option></select>
      <select id="aTopic"></select>
      <select id="aGrade"></select>
      <select id="aDiff"><option value="1">难度1 基础</option><option value="2" selected>难度2 标准</option><option value="3">难度3 提高</option></select>
      <label>题数 <input id="aN" type="number" value="5" min="1" max="20" style="width:56px"></label>
    </div>
    <p class="small muted" id="aHint"></p>
    <div id="aRefs" class="small" style="margin-top:6px"></div>
    <textarea id="aMat" hidden style="min-height:90px" placeholder="（可选）粘贴新闻报道（如 China Daily）的原文或要点、原文链接。AI 只取其中的事实，改写成适合孩子读的原创短文，不照抄原句。"></textarea>
  </div>
  <div class="card">
    <h3 style="margin-top:0">2. 直接调用大模型或本地 Codex / CLI 出题</h3>
    <div class="row">
      <label>模型 <select id="mProv">
        <option value="claude">Claude（在线版内置，用你自己的 Claude 账号，不需要密钥）</option>
        <option value="server">本机配置（llm.json API 或本地 Codex / Claude CLI）</option>
        <option value="openai">OpenAI 兼容接口（DeepSeek、通义千问、Kimi、智谱、豆包、OpenAI）</option>
        <option value="anthropic">Anthropic Claude API</option>
      </select></label>
      <select id="mPreset"></select>
    </div>
    <div class="row" id="mFields" style="margin-top:8px">
      <input id="mBase" placeholder="接口地址，如 https://api.deepseek.com/v1" style="flex:2;min-width:220px">
      <input id="mModel" placeholder="模型名" style="flex:1;min-width:120px">
      <input id="mKey" type="password" placeholder="API Key" autocomplete="off" style="flex:1;min-width:140px">
    </div>
    <label class="small" style="display:block;margin-top:8px"><input type="checkbox" id="mVerify" checked> 盲解复核：出完后让模型不看答案再做一遍，答案对不上或认为有歧义的题不入库</label>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="mGo">直接出题</button><button class="btn" id="mStop" hidden>停止</button><span class="small muted" id="mStatus"></span></div>
    <p class="small muted" id="mNote"></p>
  </div>
  <div class="card">
    <h3 style="margin-top:0">3. 或者：复制提示词给任意 AI，再把返回的 JSON 粘贴回来</h3>
    <div class="row"><button class="btn" id="aMake">生成提示词</button><button class="btn" id="aCopy">复制提示词</button></div>
    <textarea id="aPrompt" readonly style="margin-top:8px"></textarea>
    <textarea id="aJson" placeholder='[{"topic":"te.past_simple","grade":6,"difficulty":2,"type":"choice","stem":"...","choices":[["A","..."],["B","..."]],"answer":"A","explain":"..."}]'></textarea>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="aCheck">质检并导入</button><button class="btn" id="aExport">导出我导入的题</button><span class="small muted" id="aCount"></span></div>
  </div>
  <div id="aResult"></div>
</section>
</main>

<script>
const KB = window.KB;
const CAN_PRINT = !window.KB_HOSTED;   // 托管页面不允许打印，只保留卷面视图
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T = Object.fromEntries(KB.topics.map(t => [t.id, t]));
const ST = KB.exam_stats.topics;
const GRADES = KB.levels.grades;
const DOMAINS = [...new Set(KB.topics.map(t => t.domain))];
const COLORS = {'语音':'#8e6cc4','词汇':'#2f9e8f','词法':'#2f6fde','时态':'#d2493e','句法':'#d98a1e','交际':'#c4508e','阅读':'#4f8a2e','写作':'#6b6f76'};
const prereq = id => KB.dependencies.filter(d => d.topicId === id);
const unlocks = id => KB.dependencies.filter(d => d.prerequisiteId === id);
const related = id => KB.exam_stats.related.filter(r => r.a === id || r.b === id);
const tierName = {3:'必考',2:'常考',1:'偶考'};
const gname = g => GRADES[g].name;

// ---------- 本地存储（每个浏览器各自保存，换设备不会同步） ----------
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
const extraQs = () => store.get('kb.extraQuestions', []);
const allQs = () => KB.questions.concat(extraQs());
const who = () => ($('#student').value.trim() || '未命名');
$('#student').value = store.get('kb.student', '');
$('#student').onchange = () => { store.set('kb.student', $('#student').value.trim()); renderGraphStyle(); };
const mastery = () => store.get('kb.mastery.' + who(), {});           // {topicId: {r, w}}
function record(results) {
  const m = mastery();
  for (const {q, ok} of results) { const x = m[q.topic] ||= {r: 0, w: 0}; ok ? x.r++ : x.w++; }
  store.set('kb.mastery.' + who(), m);
}

// ---------- 年级匹配（与 scripts/kb.py 相同的规则） ----------
function recDiff(g, tg) { const gap = g - tg; return gap < 0 ? [] : gap === 0 ? [1, 2] : gap === 1 ? [1, 2, 3] : [2, 3]; }
function fits(q, g) { return q.grade <= g && q.grade >= g - 1 && recDiff(g, T[q.topic].grade).includes(q.difficulty); }
function gradeRate(tid, g) { const x = ST[tid] || {}, bg = g && x.byGrade?.[g]; return bg && bg.papers >= 5 ? bg.rate : (x.paperRate || 0); }
function pick(pool, n, used = {}, g = null) {
  const out = [], left = pool.slice();
  while (left.length && out.length < n) {
    const w = left.map(q => (1 + 2 * gradeRate(q.topic, g)) / (1 + 3 * (used[q.topic] || 0)));
    let r = Math.random() * w.reduce((a, b) => a + b), i = 0;
    while ((r -= w[i]) > 0) i++;
    const q = left.splice(i, 1)[0]; used[q.topic] = (used[q.topic] || 0) + 1;
    if (q.passage) {   // 短文题整组带出
      const group = left.filter(x => x.passage === q.passage);
      group.forEach(x => left.splice(left.indexOf(x), 1));
      out.push(q, ...group);
    } else out.push(q);
  }
  return out;
}

// ---------- 知识图谱 ----------
let cy;
function layout() {
  const pos = {}, colW = 330, rowH = 50, lanePad = 34; let y = 0;
  for (const d of DOMAINS) {
    const cells = {}; KB.topics.filter(t => t.domain === d).forEach(t => (cells[t.grade] ||= []).push(t));
    const rows = Math.max(...Object.values(cells).map(c => Math.ceil(c.length / 2)));
    for (const [g, ts] of Object.entries(cells))
      ts.forEach((t, i) => pos[t.id] = {x: (g - 3) * colW + (i % 2) * 150, y: y + Math.floor(i / 2) * rowH});
    y += rows * rowH + lanePad;
  }
  return pos;
}
function shortName(n) { n = n.split('：')[0]; return n.length > 12 ? n.slice(0, 11) + '…' : n; }
function initGraph() {
  if (!window.cytoscape) { $('#cy').innerHTML = '<p class="muted" style="padding:16px">图谱组件需要联网加载（cdnjs）。离线时仍可使用出题和诊断功能。</p>'; return; }
  const pos = layout();
  const els = KB.topics.map(t => ({data: {id: t.id, label: shortName(t.name), domain: t.domain, size: 14 + 34 * (ST[t.id]?.paperRate || 0)}, position: pos[t.id]}))
    .concat(KB.dependencies.map((d, i) => ({data: {id: 'e' + i, source: d.prerequisiteId, target: d.topicId, kind: d.strength}})))
    .concat(KB.exam_stats.related.map((r, i) => ({data: {id: 'r' + i, source: r.a, target: r.b, kind: 'related'}})))
    .concat(Object.keys(GRADES).map(g => ({data: {id: 'hdr' + g, label: GRADES[g].name}, position: {x: (g - 3) * 330 + 75, y: -50}, classes: 'hdr', selectable: false, grabbable: false})));
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  cy = cytoscape({container: $('#cy'), elements: els, layout: {name: 'preset'}, wheelSensitivity: .25, minZoom: .2, maxZoom: 3,
    style: [

function rankGrade(qg, g) { return qg === g ? 3 : qg === g - 1 ? 2 : qg <= g + 1 ? 1 : 0; }
function realStock(tid, g) {
  let c = 0, f = 0, r = 0, w = 0;
  for (const s of RP.singles) if (rankGrade(s.grade, g) && (s.topics || [s.topic]).includes(tid)) s.type === 'choice' ? c++ : f++;
  if (tid.startsWith('rd.')) for (const gr of RP.groups) if (rankGrade(gr.grade, g) && (tid === 'rd.cloze') === (gr.qtype === '完形填空')) r += gr.questions.length;

}

    if (units.length) $('#pGrade').value = units[0].grade;
    const merged = new Map();
    for (const u of units) {
      for (const r of u.blueprintRows || []) {
        if (!merged.has(r.topic)) merged.set(r.topic, {topic: r.topic, role: r.role, basis: `${u.id} · ${r.basis}`, choice: r.cells.choice || 0, fill: r.cells.fill || 0, reading: r.cells.reading || 0, writing: r.cells.writing || 0});

// ---------- 第二步：严格从语料库抽真题 + 缺题依照真题母题 AI 补齐 ----------
function drawOneReal(tid, secKey, g, excludeSet) {
  const cands = [];
  for (const s of RP.singles) {
    if (excludeSet.has(s.id) || s.type !== secKey || !(s.topics || [s.topic]).includes(tid)) continue;
    const rg = rankGrade(s.grade, g); if (!rg) continue;
    cands.push([100 + rg * 10 + (s.answerVerified ? 4 : 0) + (s.topic === tid ? 5 : 0) + Math.random(), s, true]);
  }
  for (const q of allQs()) {
    if (excludeSet.has(q.id) || q.passage || q.type !== secKey || q.topic !== tid) continue;
    const rg = rankGrade(q.grade, g); if (!rg) continue;
    cands.push([rg * 8 + 3 + Math.random(), q, false]);
  }
  cands.sort((a, b) => b[0] - a[0]);
  if (!cands.length) return null;
  const [, item, isReal] = cands[0];
  excludeSet.add(item.id);
  if (isReal) return {...item, topic: tid, difficulty: item.difficulty || 2, origin: 'real', status: item.answerVerified ? 'verified' : 'needs_check', examSrc: RP.sources[item.si], explain: item.explain || '', score: wb.scores[secKey]};
  return {...item, origin: item.id?.startsWith('ai-') ? 'ai' : 'curated', status: 'verified', examSrc: item.source || '正式精编题库（已审）', score: wb.scores[secKey]};
}

function drawFromCorpus() {
  const g = +$('#pGrade').value;
  wb.sections = {choice: [], fill: [], reading: [], writing: []};
  wb.shortfalls = []; wb.usedIds = new Set();

  for (const row of wb.rows) {
    const tid = row.topic;
    for (const secKey of ['choice', 'fill']) {
      const need = +row[secKey] || 0;
      let got = 0;
      for (let k = 0; k < need; k++) {
        const q = drawOneReal(tid, secKey, g, wb.usedIds);
        if (!q) break;
        wb.sections[secKey].push(q); got++;
      }
      if (got < need) wb.shortfalls.push({section: secKey, topic: tid, needed: need - got, grade: g});
    }
    const needR = +row.reading || 0;
    if (needR > 0) {
      const wantCloze = tid === 'rd.cloze';
      const gcands = [];
      for (const gr of RP.groups) {
        if (wb.usedIds.has(gr.id) || wantCloze !== (gr.qtype === '完形填空')) continue;
        const rg = rankGrade(gr.grade, g); if (!rg) continue;
        gcands.push([100 + rg * 10 + gr.questions.filter(x => x.answerVerified).length + Math.random(), gr, true]);
      }
      for (const gr of groupsOf(allQs().filter(q => (q.topic === 'rd.cloze') === wantCloze))) {
        const pid = 'CP-' + gr[0].id;
        if (wb.usedIds.has(pid)) continue;
        const rg = rankGrade(gr[0].grade, g); if (!rg) continue;
        gcands.push([rg * 9 + 5 + Math.random(), {id: pid, passage: gr[0].passage, questions: gr}, false]);
      }
      gcands.sort((a, b) => b[0] - a[0]);
      let gotR = 0;
      for (const [, gr, isReal] of gcands) {
        if (gotR >= needR) break;
        wb.usedIds.add(gr.id);
        gr.questions.forEach((q, idx) => {
          wb.sections.reading.push(isReal
            ? {...q, id: `${gr.id}-${idx + 1}`, groupId: gr.id, grade: gr.grade, difficulty: 2, passage: gr.passage, origin: 'real', status: q.answerVerified ? 'verified' : 'needs_check', examSrc: RP.sources[gr.si], explain: '', score: wb.scores.reading}
            : {...q, groupId: gr.id, origin: 'curated', status: 'verified', examSrc: q.source || '正式精编题库（已审）', score: wb.scores.reading});
          gotR++;
        });
      }
      if (gotR < needR) wb.shortfalls.push({section: 'reading', topic: tid, needed: needR - gotR, grade: g});
    }
    const needW = +row.writing || 0;
    if (needW > 0) {
      const wcands = [];
      for (const w of RP.writings) {
        if (wb.usedIds.has(w.id)) continue;
        const rg = rankGrade(w.grade, g); if (!rg) continue;
        wcands.push([100 + rg * 10 + (w.topic === tid ? 5 : 0) + Math.random(), w, true]);
      }
      for (const q of allQs().filter(x => x.type === 'writing')) {
        if (wb.usedIds.has(q.id)) continue;
        const rg = rankGrade(q.grade, g); if (!rg) continue;
        wcands.push([rg * 9 + (q.topic === tid ? 5 : 0) + Math.random(), q, false]);
      }
      wcands.sort((a, b) => b[0] - a[0]);
      let gotW = 0;
      for (const [, w, isReal] of wcands) {
        if (gotW >= needW) break;
        wb.usedIds.add(w.id);
        wb.sections.writing.push(isReal
          ? {...w, topic: tid, difficulty: 2, origin: 'real', status: 'verified', examSrc: RP.sources[w.si], require: w.require || `不少于 ${w.minWords || 60} 词`, sample: w.sample || '', points: w.points || [], phrases: w.phrases || '', explain: '', score: wb.scores.writing}
          : {...w, origin: 'curated', status: 'verified', examSrc: '正式精编题库（含范文）', score: wb.scores.writing});
        gotW++;
      }
      if (gotW < needW) wb.shortfalls.push({section: 'writing', topic: tid, needed: needW - gotW, grade: g});
    }
  }
  wb.curSec = SEC_META.find(([k]) => wb.sections[k].length)?.[0] || 'choice';
  goStep(2);
}

function buildShortfallPrompt(sf) {
  const {section, topic, needed, grade} = sf, t = T[topic], gp = GRADES[grade];
  const us = selectedCppUnits();
  const cppNote = wb.std === 'cpp' && us.length
    ? `\n【CPP 单元映射要求】：对标 ${us.map(u => `${u.id}《${u.theme}》`).join('、')}，可优先融入单元核心词（${[...cppAllowedWords()].slice(0, 18).join(', ')}）。` : '';
  if (section === 'reading') {
    const qtype = topic === 'rd.cloze' ? '完形填空' : '阅读理解';
    const refs = getLocalExemplars('passage', topic, Math.max(grade, t.grade), qtype);
    return {kind: 'passage', qtype, refs, prompt: passagePrompt(grade, 2, Math.max(3, needed), qtype, refs) + cppNote};
  }
  if (section === 'writing') {
    const refs = getLocalExemplars('writing', topic, Math.max(grade, t.grade), '书面表达');
    return {kind: 'writing', qtype: '书面表达', refs, prompt: writingPrompt(t, grade, refs) + cppNote};
  }
  const qtype = section === 'choice' ? (topic.startsWith('ph.') ? '语音辨音' : topic.startsWith('fn.') ? '情景交际' : '单项选择')
    : (topic === 'sy.word_order' ? '连词成句' : topic.startsWith('sy.') ? '句型转换' : topic === 'vo.spelling' ? '汉语提示填词' : '适当形式');
  const ex = RP.singles.filter(s => s.type === section && (s.topics || [s.topic]).includes(topic)).slice(0, 5);
  const fallback = getLocalExemplars('single', topic, Math.max(grade, t.grade), qtype);
  const refs = ex.length ? ex.map(s => ({src: RP.sources[s.si], grade: s.grade, kind: s.kind, qtype: s.qtype, text: s.stem + (s.choices ? '\n' + s.choices.map(c => `${c[0]}. ${c[1]}`).join('　') : '')})) : fallback;
  const refTxt = refs.map((e, i) => `[R${i + 1}]〔${e.src} · ${gname(e.grade)} · ${e.qtype}〕\n${e.text}`).join('\n');
  const isChoice = section === 'choice';
  const prompt = `你是河南小学英语命题老师。语料库在「${t.name}」上还缺 ${needed} 道题，请严格模仿下面给出的【真题母题】，为【${gp.name}】补齐 ${needed} 道「${qtype}」。${cppNote}
一、知识点：「${t.name}」（${t.desc}）；常见错误：${t.errors.join('；')}
二、年级约束：词汇只用${VOCAB(grade)}；单句不超过 ${gp.maxWords} 词；已学语法：${gp.grammar}。
三、版式：${FORM_RULES[qtype] || ''}
四、真题母题（逐题对照仿写考查角度、句式和设空，换语境和词汇，不得照抄；mimic 写母题编号如 "R1"）：
${refTxt || '（暂无同题型母题，请按真卷规范命题）'}
只输出 JSON 数组（共 ${needed} 题）：
[{"topic":"${topic}","grade":${grade},"difficulty":2,"qtype":"${qtype}","type":"${section}","stem":"...",${isChoice ? '"choices":[["A","..."],["B","..."],["C","..."]],"answer":"A"' : '"answer":["可接受答案"]'},"explain":"中文解析","mimic":"R1"}]`;
  return {kind: 'single', qtype, refs, prompt};
}

async function aiFillOneShortfall(idx, statusEl) {
  const sf = wb.shortfalls[idx]; if (!sf) return;
  const built = buildShortfallPrompt(sf);
  if (!canUseModel()) {
    wb.manualPrompt = built.prompt; wb.manualTarget = idx; renderStep2(); return;
  }
  ctl = new AbortController();
  statusEl.textContent = `正在仿写真题补齐「${T[sf.topic].name}」(${sf.needed} 题)…`;
  const reply = await callModel(built.prompt);
  const raw = built.kind === 'single' ? parseArr(reply) : parseObj(reply);
  const arr = normalizeAi(raw, {g: sf.grade, d: 2, topic: sf.topic, theme: '记叙情感', mat: ''});
  arr.forEach((q, i) => {
    const mIdx = parseInt(String(q.mimic || 'R1').replace(/\D+/g, ''), 10) - 1;
    const mSrc = built.refs[mIdx]?.src || built.refs[0]?.src || '语料库同考点真题';
    Object.assign(q, {id: `ai-${Date.now()}-${Math.random().toString(36).slice(2, 6)}-${i}`, topic: sf.section === 'reading' ? q.topic : sf.topic, grade: sf.grade, difficulty: 2, qtype: q.qtype || built.qtype, origin: 'ai', status: 'draft', mimicSrc: mSrc, examSrc: `AI 初稿（仿：${mSrc}）`, score: wb.scores[sf.section]});
    wb.sections[sf.section].push(q);
  });
  wb.shortfalls.splice(idx, 1);
}

}

// ---------- 第四步：人工校验（答案、歧义、超纲、查重；AI 初稿人工确认才生效） ----------
function stemWords(s) { return (String(s).toLowerCase().match(/[a-z]{2,}/g) || []); }
function stemSim(a, b) {
  const wa = stemWords(a), wb_ = stemWords(b);
  if (wa.length < 4 || wb_.length < 4) return 0;
  const sa = new Set(wa), sb = new Set(wb_);
  let inter = 0; sa.forEach(w => { if (sb.has(w)) inter++; });
  return (2 * inter) / (sa.size + sb.size);
}

function inspectPaper() {
  const g = +$('#pGrade').value, cppWords = cppAllowedWords();
  const flat = [];
  SEC_META.forEach(([sec, secName]) => wb.sections[sec].forEach((q, idx) => flat.push({q, sec, secName, idx})));
  return flat.map((item, fi) => {
    const {q, sec} = item;
    const ansIssues = [], ambigIssues = [], oobIssues = [], dupIssues = [];
    // 1. 答案核查
    if (q.type === 'choice') {
      const keys = (q.choices || []).map(c => c[0]);
      if (!q.answer || !keys.includes(q.answer)) ansIssues.push('未设置有效选项答案');
    } else if (q.type === 'fill') {
      if (!Array.isArray(q.answer) || !q.answer.length || !q.answer[0]) ansIssues.push('缺少填空参考答案');
    }
    // 2. 歧义检查
    if (q.type === 'choice') {
      const vals = (q.choices || []).map(c => c[1].trim().toLowerCase());
      if (vals.length < 2) ambigIssues.push('选项少于 2 个');
      if (new Set(vals).size !== vals.length) ambigIssues.push('存在重复选项');
    }
    if (!q.stem || q.stem.length < 4) ambigIssues.push('题干过短或缺失');
    // 3. 超纲检查（豁免所选 CPP 单元核心词）
    if (!q.topic?.startsWith('ph.') && q.type !== 'writing') {
      const right = q.type === 'choice' ? (q.choices?.find(c => c[0] === q.answer)?.[1] || '') : '';
      const rawBad = outOfBand(q.stem + ' ' + right, g).filter(w => !cppWords.has(w.toLowerCase()));
      const wc = (q.stem.match(/[A-Za-z]+/g) || []).length || 1;
      if (rawBad.length && rawBad.length / wc > (GRADES[g]?.newWords || 0) + 0.05) {
        oobIssues.push('疑似超纲词：' + [...new Set(rawBad)].slice(0, 6).join(', '));
      }
    }
    // 4. 卷内题与题查重
    if (q.type !== 'writing' && !String(q.stem).startsWith('第')) {
      for (let fj = 0; fj < flat.length; fj++) {
        if (fi === fj || flat[fj].q.type === 'writing') continue;
        const sim = stemSim(q.stem, flat[fj].q.stem);
        if (sim >= 0.75) dupIssues.push(`与「${flat[fj].secName}第${flat[fj].idx + 1}题」高度相似(${Math.round(sim * 100)}%)`);
      }
    }
    const isDraft = q.origin === 'ai' && q.status === 'draft';
    return {...item, isDraft, ansIssues, ambigIssues, oobIssues, dupIssues, hasIssue: isDraft || ansIssues.length > 0 || ambigIssues.length > 0 || oobIssues.length > 0 || dupIssues.length > 0};
  });
}

  $('#wbStep4').innerHTML = `<div class="card">
    <h3 style="margin-top:0">第四步 · 人工四维校验（答案 · 歧义 · 超纲 · 查重；AI 初稿必须人工确认才生效）</h3>
    <div class="row" style="margin-bottom:10px">

      <span class="badge ${nOob ? 'b-draft' : 'b-ok'}">疑似超纲提醒：${nOob} 题</span>
      <span class="badge ${nDup ? 'b-warn' : 'b-ok'}">卷内疑似重复：${nDup} 题</span>
      <span style="flex:1"></span>
      <label class="small"><input type="checkbox" id="wbOnlyIssues" ${wb.onlyIssues ? 'checked' : ''}> 只看待处理项</label>
      ${nAns ? `<button class="btn small" id="wbAiSolveMissing">🤖 AI 辅助拟定无答案真题的答案</button>` : ''}
      ${nDraft ? `<button class="btn primary small" id="wbApproveAll">✓ 本卷 ${nDraft} 道 AI 初稿已核无误，全部确认生效</button>` : ''}
    </div>
    <p class="small muted" id="wbVerifyMsg"></p>
    <div class="scroll"><table><thead><tr><th style="min-width:95px">位置</th><th>题目与来源</th><th style="min-width:160px">核定答案</th><th>四维校验结果</th><th style="min-width:140px">生效确认</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" class="res-ok">全部题目已通过校验并生效！</td></tr>'}</tbody></table></div>
    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="goStep(3)">← 返回分板块微调</button>

// ---------- 第五步：组装正式试卷、打印与作答诊断 ----------
function buildFinalPaper() {
  const g = +$('#pGrade').value, qs = [], sections = [];
  let totalScore = 0;
  SEC_META.forEach(([k, name]) => {
    const list = wb.sections[k];
    if (!list.length) return;
    const secPts = list.reduce((s, q) => s + (+q.score || wb.scores[k]), 0);
    totalScore += secPts;
    sections.push({key: k, name: `${name}（共 ${list.length} ${k === 'writing' ? '篇' : '小题'}，${secPts} 分）`, start: qs.length});
    qs.push(...list);
  });
  paper = {id: Date.now(), grade: g, title: wb.title || `${gname(g)}英语测试卷`, subtitle: wb.subtitle, totalScore, qs, sections, answers: {}, marks: {}, scores: {}};
}

function essayHtml(q, i, mode) {
  const pts = q.score || 10;
  const srcTag = q.examSrc ? `<span class="meta">〔来源：${esc(q.examSrc)}〕</span>` : '';
  let h = `<div class="qhead"><span class="qnum">${i + 1}.</span><div style="flex:1"><div>${safeRich(q.stem)} ${mode === 'teacher' || (mode === 'print' && wb.showSrcStudent) ? srcTag : ''}</div>
    ${q.require ? `<div class="small" style="margin-top:4px">要求：${esc(q.require)}（满分 ${pts} 分）</div>` : ''}
    ${q.points?.length ? `<div class="small">要点：${q.points.map(esc).join('；')}</div>` : ''}
    ${q.title && q.title !== '书面表达' ? `<div style="text-align:center;font-weight:600;margin:8px 0">${esc(q.title)}</div>` : ''}`;
  if (mode === 'answer') h += `<textarea class="essay" data-essay="${i}" placeholder="在这里写作文…"></textarea><div class="small muted">已写 <b data-wc="${i}">0</b> 词，要求不少于 ${q.minWords || 50} 词</div>`;
  else if (mode === 'print') h += `<div class="lines">${'<div></div>'.repeat(Math.ceil((q.minWords || 60) / 9) + 3)}</div>`;
  else h += `${q.phrases ? `<div class="explain">好句：${esc(q.phrases)}</div>` : ''}<div class="explain">评分标准：${RUBRIC}</div>
      ${q.sample ? `<div class="passage">参考范文（${wcount(q.sample)} 词）：\n${esc(q.sample)}</div>` : '<div class="explain">（真卷原题未附固定范文，按五档评分标准批阅）</div>'}
      ${mode === 'mark' ? `<label class="small noprint">得分 <input type="number" min="0" max="${pts}" step="0.5" data-score="${i}" style="width:70px"> / ${pts}</label>` : ''}`;
  return h + '</div></div>';
}
function qHtml(q, i, mode) {
  if (q.type === 'writing') return essayHtml(q, i, mode);
  const srcInline = q.examSrc && (mode === 'teacher' || mode === 'mark' || (mode === 'print' && wb.showSrcStudent && q.origin === 'real'))
    ? ` <span class="meta">〔${esc(q.examSrc)}〕</span>` : '';
  const head = `<div class="qhead"><span class="qnum">${i + 1}.</span><div style="flex:1">${safeRich(q.stem)}${srcInline}
    ${mode === 'teacher' || mode === 'mark' ? `<div class="meta">${esc(T[q.topic]?.name || q.topic)} · ${q.score || 2} 分</div>` : ''}`;
  let body = '';

function finish(res) {

  for (const r of essays) if (r.score !== undefined) {
    res.push({q: r.q, ok: r.score >= 7, given: `${r.score} 分`});
    for (const e of r.essay?.errors || []) if (T[e.topic])   // 作文里的错误也记到对应知识点上
      res.push({q: {topic: e.topic, stem: '作文：' + e.wrong, type: 'fill', answer: [e.right], explain: e.why}, ok: false, given: e.wrong});
  }
  record(res);
  const by = {};
  res.forEach(r => { const x = by[r.q.topic] ||= {r: 0, n: 0, wrong: []}; x.n++; if (r.ok) x.r++; else x.wrong.push(r); });
  const weak = Object.keys(by).filter(id => by[id].r / by[id].n < .67);
  const strong = Object.keys(by).filter(id => by[id].r === by[id].n);
  const m = mastery();
  // 回溯：薄弱点的“必须先学”里，哪些也薄弱（根因）或从没测过（需要补测）
  const roots = {}, untested = new Set();
  for (const id of weak) {
    for (const d of prereq(id).filter(d => d.strength === 'hard')) {
      const p = d.prerequisiteId, pm = m[p];
      if (pm && pm.r / (pm.r + pm.w) < .67) (roots[id] ||= []).push(p);
      else if (!pm) untested.add(p);
    }
  }
  const rate = Math.round(res.filter(r => r.ok).length / res.length * 100);
  const order = weak.flatMap(id => [...(roots[id] || []), id]).filter((v, i, a) => a.indexOf(v) === i)
    .sort((a, b) => T[a].grade - T[b].grade);
  const comment = makeComment(rate, res.length, weak, strong, roots, by);
  $('#reportBox').innerHTML = `<div class="card">
      <div class="row"><h2 style="margin:0">诊断报告 · ${esc(who())}</h2><span class="muted">${gname(paper.grade)} · ${res.length} 题 · 正确率 ${rate}%</span><span style="flex:1"></span>${CAN_PRINT ? '<button class="btn noprint" onclick="print()">打印报告</button>' : ''}</div>
      <h3>老师点评</h3><div>${comment}</div>
    </div>
    ${essays.map(essayReport).join('')}
    <div class="card"><h3 style="margin-top:0">各知识点得分</h3><div class="scroll"><table><tr><th>知识点</th><th>得分</th><th></th><th>本次错题</th></tr>
      ${Object.entries(by).sort((a, b) => a[1].r / a[1].n - b[1].r / b[1].n).map(([id, x]) => {
        const a = x.r / x.n, c = a >= .8 ? 'var(--good)' : a >= .5 ? 'var(--mid)' : 'var(--bad)';
        return `<tr><td>${topicLink(id)}<div class="meta">${tierName[ST[id]?.tier || 1]}</div></td><td>${x.r}/${x.n}</td><td><div class="bar"><i style="width:${a * 100}%;background:${c}"></i></div></td>
          <td class="small">${x.wrong.map(w => w.q.type === 'writing' ? `书面表达《${esc(w.q.title)}》得 ${esc(w.given)}，见下方作文批改` : `${esc(w.q.stem)}<div class="explain">正确：${esc(w.q.type === 'choice' ? w.q.answer + '. ' + Object.fromEntries(w.q.choices)[w.q.answer] : w.q.answer[0])}${w.given ? '；孩子答：' + esc(w.given) : ''}。${esc(w.q.explain)}</div>`).join('') || '—'}</td></tr>`;
      }).join('')}</table></div></div>
    ${weak.length ? `<div class="card"><h3 style="margin-top:0">针对性训练</h3>
      <p class="small">按“先补先修、再练本点”的顺序：${order.map(topicLink).join(' → ')}</p>
      ${untested.size ? `<p class="small muted">这些先修点还没测过，建议顺带测一下，判断是不是根因：${[...untested].map(topicLink).join('、')}</p>` : ''}

function essayReport(r) {

function makeComment(rate, n, weak, strong, roots, by) {

  let s = `<p>本次共 ${n} 题，正确率 ${rate}%，${lv}。</p>`;
  if (strong.length) s += `<p><b>掌握较好：</b>${strong.slice(0, 6).map(id => esc(T[id].name)).join('、')}。</p>`;
  for (const id of weak.sort((a, b) => (ST[b]?.paperRate || 0) - (ST[a]?.paperRate || 0)).slice(0, 5)) {
    const t = T[id], x = by[id];
    s += `<p><b>${x.n === 1 ? '待确认' : '需要加强'}：${esc(t.name)}</b>（${x.r}/${x.n}${ST[id]?.tier === 3 ? '，小升初必考' : ''}${x.n === 1 ? '，只考了 1 题，建议再练 2~3 题确认' : ''}）。这类题孩子常见的错误是：${t.errors.slice(0, 2).map(esc).join('；')}。建议：${esc(t.tips)}`;
    if (roots[id]) s += ` <span class="res-bad">根因提示：</span>先修点「${roots[id].map(p => esc(T[p].name)).join('」「')}」也不扎实，建议先复习它再回到本点。`;
    s += '</p>';
  }
  if (!weak.length) s += '<p>没有明显薄弱点，可以升高一个年级或难度继续练习。</p>';

}

// ---------- 自适应练习：答对两题升难度，答错降难度；基础题也错就回溯到先修点 ----------
let pr = null;
function startPractice(ids) {
  const g = +$('#pGrade').value;
  pr = {queue: ids.slice(), g, d: {}, streak: 0, done: [], seen: new Set(), cur: null};
  switchTab('report'); nextPractice();
}
function nextPractice() {
  while (pr.queue.length) {
    const id = pr.queue[0], g = Math.max(pr.g, T[id].grade);
    const d = pr.d[id] ??= Math.min(...(recDiff(g, T[id].grade).length ? recDiff(g, T[id].grade) : [1]));
    const realCand = RP.singles.filter(s => s.answerVerified && (s.topics || [s.topic]).includes(id) && s.grade <= g && !pr.seen.has(s.id))
      .map(s => ({...s, topic: id, difficulty: 2, origin: 'real', examSrc: RP.sources[s.si], explain: `真题来源：${RP.sources[s.si]}`}));
    const cand = realCand.concat(allQs().filter(q => q.topic === id && q.type !== 'writing' && q.grade <= g && !pr.seen.has(q.id)));
    const q = cand.sort((a, b) => Math.abs(a.difficulty - d) - Math.abs(b.difficulty - d) || b.grade - a.grade)[0];
    const doneHere = pr.done.filter(r => r.q.topic === id).length;
    if (!q || doneHere >= 4) { pr.queue.shift(); pr.streak = 0; continue; }
    pr.cur = q; pr.seen.add(q.id); return renderPractice();
  }
  const ok = pr.done.filter(r => r.ok).length;
  $('#practiceBox').innerHTML = `<div class="card"><h3 style="margin-top:0">练习完成</h3><p>共 ${pr.done.length} 题，答对 ${ok} 题。结果已记入 ${esc(who())} 的掌握情况，可以在知识图谱里勾选「按掌握情况着色」查看。</p></div>`;
}
function renderPractice() {
  const q = pr.cur;
  $('#practiceBox').innerHTML = `<div class="card"><div class="row"><b>针对性训练</b><span class="small muted">当前：${esc(T[q.topic].name)} · 难度 ${q.difficulty}　剩余知识点 ${pr.queue.length}</span></div>
    ${q.passage ? `<div class="passage">${esc(q.passage)}</div>` : ''}<div class="q">${qHtml(q, 0, 'answer')}</div>
    <div id="prFb"></div><button class="btn primary" id="prGo">提交</button></div>`;
  $('#practiceBox').scrollIntoView({behavior: 'smooth'});
  $('#prGo').onclick = () => {
    const given = q.type === 'choice' ? document.querySelector('input[name="q0"]:checked')?.value : document.querySelector('[data-fill="0"]').value;
    const ok = isRight(q, given); pr.done.push({q, ok}); record([{q, ok}]);
    const id = q.topic;
    if (ok) { if (++pr.streak >= 2) { pr.d[id] = Math.min(3, pr.d[id] + 1); pr.streak = 0; } }
    else {
      pr.streak = 0;
      if (pr.d[id] > 1) pr.d[id]--;
      else {   // 基础题也错：回溯到一个必须先学的点
        const p = prereq(id).filter(d => d.strength === 'hard').map(d => d.prerequisiteId).find(p => !pr.queue.includes(p) && !pr.done.some(r => r.q.topic === p));
        if (p) pr.queue.unshift(p);
      }
    }
    $('#prFb').innerHTML = `<p class="${ok ? 'res-ok' : 'res-bad'}">${ok ? '答对了！' : '答错了。'}正确答案：${esc(q.type === 'choice' ? q.answer : q.answer[0])}</p>
      <div class="explain">${esc(q.explain)}${ok ? '' : '<br>提示：' + esc(T[id].tips)}</div>`;
    $('#prGo').textContent = '下一题'; $('#prGo').onclick = nextPractice;
  };
}

    const x = !errs.length && extraErr?.(q, i); if (x) errs.push(x);
    rows.push(`<tr><td>${i + 1}</td><td>${q.type === 'writing' ? `<b>${esc(q.title)}</b><div class="small">${esc(q.stem)}</div><div class="passage">${esc(q.sample || '')}</div>` : ''}${q.passage && (i === 0 || arr[i - 1].passage !== q.passage) ? passageHtml(q) : ''}${q.type === 'writing' ? '' : esc(q.stem || '')}${q.choices ? `<div class="small muted">${q.choices.map(c => esc(c[0] + '. ' + c[1])).join('　')}</div>` : ''}${q.type === 'writing' ? '' : `<div class="small muted">答案：${esc(Array.isArray(q.answer) ? q.answer.join(' / ') : q.answer)}　${esc(q.explain || '')}</div>`}</td><td>${errs.length ? `<span class="res-bad">未导入：${esc(errs.join('；'))}</span>` : warns.length ? `<span style="color:var(--mid)">已导入，请人工核对：${esc(warns.join('；'))}</span>` : '<span class="res-ok">通过</span>'}</td></tr>`);
    if (!errs.length) kept.push({...q, id: 'ai-' + Date.now() + '-' + i, source, review: warns.length ? '待核' : '机检通过'});
  });
  store.set('kb.extraQuestions', extraQs().concat(kept));
  $('#aResult').innerHTML = `<div class="card"><p>导入 ${kept.length} / ${arr.length} 题。机检查格式、年级词汇和句长${extraErr ? '，盲解复核查答案是否唯一' : ''}；<b>入库前仍建议老师看一遍</b>。</p>
    <div class="scroll"><table>${rows.join('')}</table></div>
    ${kept.length ? `<div class="row" style="margin-top:8px"><button class="btn" onclick="startPractice(['${esc(arr[0].topic)}'])" ${arr[0].type === 'writing' ? 'hidden' : ''}>用这些题练一练</button></div>` : ''}</div>`;
  updateCount(); renderStats();
}
$('#aExport').onclick = () => {
  $('#aResult').innerHTML = `<p class="small">下面是你导入的 ${extraQs().length} 道题（JSON），全选复制后可以发给我合并进正式题库：</p><textarea id="aOut" readonly>${esc(JSON.stringify(extraQs(), null, 1))}</textarea>`;
  $('#aOut').select();
};
// ---------- 直接调用大模型 ----------
const PRESETS = {
  'DeepSeek V4 Pro（质量优先）': ['openai', 'https://api.deepseek.com/v1', 'deepseek-v4-pro'],
  'DeepSeek Flash（速度优先）': ['openai', 'https://api.deepseek.com/v1', 'deepseek-flash'],
  '通义千问': ['openai', 'https://dashscope.aliyuncs.com/compatible-mode/v1', 'qwen-plus'],
  'Kimi': ['openai', 'https://api.moonshot.cn/v1', 'moonshot-v1-8k'],
  '智谱 GLM': ['openai', 'https://open.bigmodel.cn/api/paas/v4', 'glm-4-flash'],
  '豆包': ['openai', 'https://ark.cn-beijing.volces.com/api/v3', ''],
  'OpenAI': ['openai', 'https://api.openai.com/v1', 'gpt-4o-mini'],
  'Claude': ['anthropic', 'https://api.anthropic.com', 'claude-opus-5-5'],
};
let sampleFn = null, proxy = null, ctl = null;
const llmCfg = () => store.get('kb.llm', {prov: '', base: '', model: '', key: ''});
function saveLlm() { store.set('kb.llm', {prov: $('#mProv').value, base: $('#mBase').value.trim(), model: $('#mModel').value.trim(), key: $('#mKey').value.trim()}); }
function renderModelUi() {
  const p = $('#mProv').value, custom = p === 'openai' || p === 'anthropic';
  $('#mFields').hidden = !custom; $('#mPreset').hidden = !custom;
  $('#mPreset').innerHTML = '<option value="">选常用接口…</option>' + Object.entries(PRESETS).filter(([, v]) => v[0] === p).map(([k]) => `<option>${k}</option>`).join('');
  $('#mNote').textContent = {
    claude: '用的是你在 claude.ai 的账号额度。第一次出题时页面会请你允许它使用 Claude。',
    server: `使用本机 kb.py serve 配置的模型（当前：${proxy?.provider || ''}${proxy?.model ? '/' + proxy.model : ''}）。密钥只在本机 llm.json 里，或直接调用本地 codex / claude CLI。`,
    openai: proxy ? '通过本机 kb.py serve 转发。API Key 只保存在这台电脑的浏览器里。' : 'API Key 只保存在这台电脑的浏览器里。有的接口不允许浏览器直接调用，出错时请改用 python3 scripts/kb.py serve 打开本页。',
    anthropic: proxy ? '通过本机 kb.py serve 转发。API Key 只保存在这台电脑的浏览器里。' : 'API Key 只保存在这台电脑的浏览器里。',
  }[p];
}
async function initModels() {
  const opt = v => $(`#mProv option[value="${v}"]`);
  if (window.KB_HOSTED) {   // 托管页面禁止访问外部网址，只能用内置 Claude
    opt('openai').disabled = opt('anthropic').disabled = opt('server').disabled = true;
    opt('openai').textContent += '（只在本地版可用）'; opt('anthropic').textContent += '（只在本地版可用）'; opt('server').hidden = true;
  } else {
    opt('claude').hidden = true;
    if (location.protocol.startsWith('http')) {
      try { const r = await fetch('/api/llm-config'); if (r.ok) proxy = await r.json(); } catch {}
    }
    if (!proxy?.configured) { opt('server').disabled = true; opt('server').textContent += '（未配置）'; }
  }
  const c = llmCfg();
  $('#mBase').value = c.base || ''; $('#mModel').value = c.model || ''; $('#mKey').value = c.key || '';
  const ok = v => v && !opt(v).disabled && !opt(v).hidden;
  $('#mProv').value = ok(c.prov) ? c.prov : ['claude', 'server', 'openai'].find(ok);
  renderModelUi();
  if (window.KB_HOSTED && window.claude?.use) {
    sampleFn = await claude.use('sample');
    if (!sampleFn) { opt('claude').disabled = true; opt('claude').textContent += '（当前环境不可用）'; $('#mGo').disabled = true; $('#mNote').textContent = '这里用不了内置 Claude，可以改用下面的“复制提示词”。'; }
  }
}
$('#mProv').onchange = () => { saveLlm(); renderModelUi(); };
$('#mPreset').onchange = () => { const v = PRESETS[$('#mPreset').value]; if (!v) return; $('#mBase').value = v[1]; $('#mModel').value = v[2]; saveLlm(); if (!v[2]) $('#mModel').placeholder = '填推理接入点 ID'; };
['mBase', 'mModel', 'mKey'].forEach(id => $('#' + id).onchange = saveLlm);

async function postJson(url, body, headers = {}) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json', ...headers}, body: JSON.stringify(body), signal: ctl.signal});
  const t = await r.text(); let j; try { j = JSON.parse(t); } catch { j = null; }
  if (!r.ok) throw new Error(`接口返回 ${r.status}：${(j?.error?.message || j?.error || t).toString().slice(0, 200)}`);
  return j;
}
async function callModel(prompt) {
  const p = $('#mProv').value;
  if (p === 'claude') {
    try { return (await sampleFn(prompt, {signal: ctl.signal, cache: false})).text; }
    catch (e) { throw new Error({not_granted: '你没有允许这个页面使用 Claude', rate_limited: '调用太频繁或额度用完，请稍后再试', cancelled: '已停止', sampling_disabled: '这个账号不能在页面里使用 Claude'}[e.code] || e.message || String(e)); }
  }
  if (p === 'server') return (await postJson('/api/llm', {prompt})).text;
  const cfg = {provider: p, base_url: $('#mBase').value.trim(), model: $('#mModel').value.trim(), api_key: $('#mKey').value.trim()};
  if (!cfg.api_key || (p === 'openai' && (!cfg.base_url || !cfg.model))) throw new Error('请先填写接口地址、模型名和 API Key');
  if (proxy) return (await postJson('/api/llm', {prompt, cfg})).text;
  try {
    if (p === 'openai') return (await postJson(cfg.base_url.replace(/\/$/, '') + '/chat/completions', {model: cfg.model, messages: [{role: 'user', content: prompt}]}, {Authorization: 'Bearer ' + cfg.api_key})).choices[0].message.content;
    const r = await postJson((cfg.base_url || 'https://api.anthropic.com').replace(/\/$/, '') + '/v1/messages',
      {model: cfg.model || 'claude-opus-5-5', max_tokens: 16000, fallbacks: 'default', messages: [{role: 'user', content: prompt}]},
      {'x-api-key': cfg.api_key, 'anthropic-version': '2023-06-01', 'anthropic-beta': 'server-side-fallback-2026-07-01', 'anthropic-dangerous-direct-browser-access': 'true'});
    if (r.stop_reason === 'refusal') throw new Error('模型拒绝了这次请求');
    return r.content.filter(b => b.type === 'text').map(b => b.text).join('');
  } catch (e) {
    if (e.name === 'TypeError') throw new Error('浏览器无法直接连这个接口（多半是跨域限制）。请在项目目录运行 python3 scripts/kb.py serve，再打开 http://localhost:8765');
    throw e;
  }
}
const parseObj = t => { const m = String(t).match(/\{[\s\S]*\}/); if (!m) throw new Error('模型没有返回 JSON'); return JSON.parse(m[0]); };
function normalizeAi(v, ctx) {   // 单题数组 / 篇章对象 / 作文对象 → 题目数组
  const {g, d, topic, theme, mat} = ctx;
  if (Array.isArray(v)) return v.filter(q => q && typeof q === 'object').map(q => ({...q, topic: q.topic || topic, grade: +(q.grade || g), difficulty: +(q.difficulty || d)}));
  if (v.passage && Array.isArray(v.questions)) {
    const url = (mat || '').match(/https?:\/\/\S+/)?.[0];
    const hasTitleQ = v.questions.some(q => /title/i.test(q.stem || ''));
    return v.questions.map(q => ({...q, topic: T[q.topic] && q.topic.startsWith('rd.') ? q.topic : 'rd.detail', type: q.type || 'choice', grade: g, difficulty: d,
      passage: String(v.passage).split('\n').map(x => x.trim()).filter(Boolean).join('\n'), theme: v.theme || theme, title: hasTitleQ ? '' : (v.title || ''), source: url || (mat ? 'AI 根据素材改写' : 'AI 原创')}));
  }
  if (v.sample) return [{topic, grade: g, difficulty: d, type: 'writing', title: v.title || '', stem: v.stem || '', require: v.require || '',
    points: v.points || [], minWords: +v.minWords || 60, phrases: v.phrases || '', sample: v.sample, explain: ''}];
  throw new Error('看不懂这段 JSON：既不是题目数组，也不是篇章或作文');
}
const parseArr = t => { const m = String(t).match(/\[[\s\S]*\]/); if (!m) throw new Error('模型没有返回题目 JSON'); return JSON.parse(m[0]); };
function blindPrompt(qs, g) {
  const shared = qs.length && qs.every(q => q.passage && q.passage === qs[0].passage) ? qs[0].passage : '';
  const lines = qs.map((q, i) => `${i + 1}. ${q.stem}${q.passage && !shared ? '\n（短文）' + q.passage : ''}${(q.choices || []).map(c => `\n   ${c[0]}. ${c[1]}`).join('')}`);
  if (shared) lines.unshift('短文：\n' + shared + '\n');
  return `你是认真的英语老师。下面是给${gname(g)}学生的英语题，请独立作答，每题给一个最佳答案。选择题回答选项字母；填空题回答要填的内容，多个空用逗号隔开。如果某题没有正确答案或不止一个正确答案，answer 写 "?"，并在 note 里说明原因。
只输出 JSON 数组：[{"i":1,"answer":"B","note":""}]

${lines.join('\n')}`;
}
function blindErr(q, a) {
  if (!a) return '复核没有作答';
  const got = String(a.answer ?? '').trim();
  if (got === '?') return '复核认为有歧义：' + (a.note || '');
  const ok = q.type === 'choice' ? got.slice(0, 1).toUpperCase() === q.answer : isRight(q, got);
  return ok ? null : `复核作答为 ${got}，与给定答案不一致`;
}
$('#mStop').onclick = () => ctl?.abort();
$('#mGo').onclick = async () => {
  makePrompt();
  const k = $('#aKind').value, t = k === 'passage' ? 'rd.detail' : $('#aTopic').value, g = +$('#aGrade').value, d = +$('#aDiff').value;
  if (k !== 'passage' && !recDiff(g, T[t].grade).length) { $('#mStatus').textContent = `「${T[t].name}」首学在${gname(T[t].grade)}，${gname(g)}还没学。`; return; }
  ctl = new AbortController(); $('#mGo').disabled = true; $('#mStop').hidden = false;
  try {
    $('#mStatus').textContent = '正在出题…（快速模型约半分钟，DeepSeek-V4-Pro 等推理模型要 1~3 分钟）';
    const reply = await callModel($('#aPrompt').value);
    const arr = normalizeAi(k === 'single' ? parseArr(reply) : parseObj(reply), {g, d, topic: t, theme: $('#aTheme').value, mat: $('#aMat').value});
    if (k === 'single') arr.forEach(q => Object.assign(q, {topic: t, grade: g, difficulty: d}));
    let solved = {};
    if ($('#mVerify').checked && k !== 'writing' && arr.length) {
      $('#mStatus').textContent = `出了 ${arr.length} 题，正在盲解复核…`;
      parseArr(await callModel(blindPrompt(arr, g))).forEach(a => solved[+a.i] = a);
    }
    importQs(arr, $('#mVerify').checked && k !== 'writing' ? (q, i) => blindErr(q, solved[i + 1]) : null, 'AI·' + ($('#mProv').value === 'claude' ? 'Claude' : $('#mModel').value || proxy?.model || $('#mProv').value));
    $('#mStatus').textContent = '完成';
  } catch (e) {
    $('#mStatus').innerHTML = `<span class="res-bad">${esc(e.message || e)}</span>`;
  } finally { $('#mGo').disabled = false; $('#mStop').hidden = true; }
};

function updateCount() { $('#aCount').textContent = `浏览器里已导入 ${extraQs().length} 道 AI 题（只保存在本机这个浏览器）`; }

// ---------- 启动 ----------
function switchTab(name) {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + name));
  if (name === 'graph' && cy) { cy.resize(); renderGraphStyle(); }
}
$('#nav').onclick = e => e.target.dataset.tab && switchTab(e.target.dataset.tab);
renderStats(); initGraph(); syncKind(); makePrompt(); updateCount(); initModels().then(() => loadBlueprintFromMode()); loadBlueprintFromMode();
</script>
